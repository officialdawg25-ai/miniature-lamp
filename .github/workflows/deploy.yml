name: Validate Institutional AI build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: institutional-ai-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate XAUUSD ingestion function
        run: |
          deno check supabase/functions/xauusd-ingestion/index.ts supabase/functions/xauusd-ingestion/validation_test.ts
          deno test supabase/functions/xauusd-ingestion/validation_test.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
